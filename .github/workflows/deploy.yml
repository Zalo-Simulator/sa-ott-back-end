name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  HOST: ${{ secrets.EC2_PUBLIC_IP }}
  USER: "ubuntu"
  WORKING_DIRECTORY: ${{ github.workspace }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_REPO: ${{ vars.DOCKER_REPO_DEV }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare docker image tags
        run: echo "IMAGE_URI=${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build and Push the Docker image
        run: |
          docker build -t ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }} ${{ env.WORKING_DIRECTORY }}
          docker push ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}

      - name: SSH into EC2 and Deploy
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -t -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
            cd ~/backend
            git pull origin main
            docker compose down
            docker compose up -d --build
          EOF
