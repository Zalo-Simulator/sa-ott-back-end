name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  HOST: ${{ secrets.EC2_PUBLIC_IP }}
  USER: "ubuntu"
  WORKING_DIRECTORY: ${{ github.workspace }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_REPO: ${{ vars.DOCKER_REPO_DEV }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare docker image tags
        run: echo "IMAGE_URI=${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build and Push the Docker image
        run: |
          docker build -t ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }} ${{ env.WORKING_DIRECTORY }}
          docker push ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
      
      - name: Install AWS CLI & Docker on EC2
        run: |
          echo "${{ env.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ env.USER }}@${{ env.HOST }} << 'EOF'
            echo "Installing AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            
            echo "Installing Docker..."
            sudo apt update -y
            sudo apt install -y apt-transport-https ca-certificates curl software-properties-common
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
            sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
            sudo apt update -y
            sudo apt install -y docker-ce
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
          EOF

      - name: Deploy to EC2
        run: |
          echo "${{ env.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ env.USER }}@${{ env.HOST }} << 'EOF'
            echo "Installing AWS CLI & Docker..."
            sudo apt update -y
            sudo apt install -y awscli docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            
            echo "Logging into AWS ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.DOCKER_REPO }}
            
            echo "Pulling latest image..."
            docker pull ${{ env.IMAGE_URI }}
            
            echo "Stopping old container..."
            docker stop backend || true
            docker rm backend || true
            
            echo "Running new container..."
            docker run -d --name backend -p 8000:8000 --restart unless-stopped ${{ env.IMAGE_URI }}
          EOF
          
          rm -f private_key.pem
