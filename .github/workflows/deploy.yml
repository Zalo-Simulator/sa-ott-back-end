name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

env:
  # AWS Credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

  # EC2 Credentials
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  HOST: ${{ secrets.EC2_PUBLIC_IP }}
  USER: "ubuntu"

  # Docker & GitHub Vars
  WORKING_DIRECTORY: ${{ github.workspace }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_REPO: ${{ vars.DOCKER_REPO_DEV }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Docker Image Tag
        run: echo "IMAGE_URI=${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build and Push the Docker Image
        run: |
          docker build -t $IMAGE_URI $WORKING_DIRECTORY
          docker push $IMAGE_URI
      
      - name: Deploy to EC2
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
            echo "Updating system and installing dependencies..."
            sudo apt update -y
            sudo apt install -y awscli docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            
            echo "Logging into AWS ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $DOCKER_REPO
            
            echo "Pulling the latest image..."
            docker pull $IMAGE_URI
            
            echo "Stopping and removing old container..."
            docker stop backend || true
            docker rm backend || true
            
            echo "Running new container..."
            docker run -d --name backend -p 8000:8000 --restart unless-stopped $IMAGE_URI
          EOF
          
          rm -f private_key.pem
