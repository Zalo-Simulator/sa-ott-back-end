services:
  db:
    image: postgres:13.2
    container_name: postgres_db
    volumes:
      - ./docker/db:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    expose:
      - "5432"
    ports:
      - "5454:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      timeout: 5s
    restart: unless-stopped

  alembic:
    image: fastapi-base:latest
    user: root  # Chạy container với user root
    environment:
      SQL_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/postgres"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir -r requirements.txt &&
        alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  app:
    image: fastapi-base:latest
    container_name: fastapi_app
    user: root  # Chạy với quyền root
    environment:
      SQL_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/postgres"
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      alembic:
        condition: service_started

  localstack:
    container_name: zalo_localstack
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # External services port range
    environment:
      - DEBUG=${DEBUG:-0}
      - SERVICES=s3
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - zalo_net  # <-- Thêm dòng này nếu chưa có

volumes:
  localstack_data:  # <-- Định nghĩa volume

networks:
  zalo_net:  # <-- Định nghĩa network
    driver: bridge
